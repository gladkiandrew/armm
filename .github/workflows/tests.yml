name: tests
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit tests (isolated home, no keys)
        run: |
          export HOME="$RUNNER_TEMP/home" ARMM_HOME="$RUNNER_TEMP/home/armm"
          mkdir -p "$ARMM_HOME"
          python -m py_compile *.py
          python -m unittest -q test_armm test_signals test_autopilot test_starvation
