name: tests
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: make check — 281 offline tests + every safety invariant
        run: |
          export HOME="$RUNNER_TEMP/home" ARMM_HOME="$RUNNER_TEMP/home/armm"
          mkdir -p "$ARMM_HOME"
          # Throwaway random values so the runtime demo-lock proof can construct a
          # client. Nothing here touches the network or places an order.
          for k in WEEX_API_KEY WEEX_API_SECRET WEEX_API_PASSPHRASE; do
            echo "$k=$(openssl rand -hex 16)"
          done > "$ARMM_HOME/.env"
          make check
